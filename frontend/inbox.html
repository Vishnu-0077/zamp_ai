<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AP Inbox · Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#192b40;font:14px system-ui,sans-serif}header{background:#152d40;color:white;padding:22px 30px;display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0}header p{margin:6px 0 0;color:#bcd0df}.badge{background:#29485c;padding:7px 12px;border-radius:20px}main{display:grid;grid-template-columns:350px minmax(0,1fr);height:calc(100vh - 94px)}aside{border-right:1px solid #dce3eb;background:white;display:flex;flex-direction:column;min-height:0}.search{padding:18px;border-bottom:1px solid #e3e8ef}input{width:100%;padding:12px;border:1px solid #ccd6e1;border-radius:8px;font:inherit}#count{font-size:12px;color:#64748b;margin-top:10px}#list{overflow:auto;flex:1}.row{display:block;background:white;border:0;border-bottom:1px solid #e8edf2;padding:18px;text-align:left;width:100%;cursor:pointer;color:inherit;font:inherit}.row:hover{background:#f3f7fb}.row.active{background:#eaf4f5;border-left:4px solid #17877e;padding-left:14px}.sender{font-weight:650;margin-bottom:6px}.subject{font-size:13px;line-height:1.5}.small{color:#6b7b8e;font-size:12px;margin-top:8px}article{overflow:auto;padding:30px;max-width:1200px;width:100%;margin:auto;height:100%}.card{background:white;border:1px solid #dce3eb;border-radius:12px;padding:26px;margin-bottom:20px}h2{font-size:23px;margin:0 0 22px;line-height:1.4}.meta{font-size:13px;color:#536579;margin:7px 0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 system-ui,sans-serif;margin:28px 0 0;color:#24394d}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}a{color:#12796f;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}.primary{padding:10px 16px;background:#147c73;color:white;border-radius:7px}.toolbar span{margin-right:auto;font-weight:650}iframe{width:100%;height:640px;border:1px solid #dce3eb;border-radius:7px}.empty{padding:30px;color:#64748b}button:focus-visible,a:focus-visible{outline:3px solid #e7ac44;outline-offset:2px}@media(max-width:850px){main{grid-template-columns:280px minmax(0,1fr)}article{padding:16px}.card{padding:18px}}@media(max-width:600px){header{padding:18px}main{display:block;height:auto}aside{height:320px;border-right:0;border-bottom:1px solid #ccd6e1}article{height:auto}iframe{height:480px}.badge{font-size:11px}}
</style></head>
<body><header><div><h1>Accounts payable</h1><p>Vendor inbox · Example Manufacturing</p></div><span class="badge">Demo · Fictional data</span></header>
<main><aside><div class="search"><label for="search" style="display:block;margin-bottom:10px;font-weight:650">Inbox</label><input id="search" type="search" placeholder="Search sender, subject or invoice…"><div id="count" role="status">Loading emails…</div></div><nav id="list" aria-label="Email messages"></nav></aside><article id="reader"><div class="empty">Select an email to read the message and view its invoice.</div></article></main>
<script>
const list=document.querySelector('#list'), reader=document.querySelector('#reader'), search=document.querySelector('#search');let emails=[],selected=null,request=0;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function render(){const q=search.value.toLowerCase(),filtered=emails.filter(e=>(e.sender+' '+e.subject).toLowerCase().includes(q));list.replaceChildren();document.querySelector('#count').textContent=`${filtered.length} of ${emails.length} emails`;for(const e of filtered){const b=el('button',undefined,'row'+(e.id===selected?' active':''));b.type='button';b.setAttribute('aria-pressed',e.id===selected?'true':'false');b.append(el('div',e.sender.split('@')[1],'sender'),el('div',e.subject,'subject'),el('div',`Message ${String(e.id).padStart(2,'0')}`,'small'));b.onclick=()=>openEmail(e.id);list.append(b)}if(!filtered.length)list.append(el('div','No matching emails.','empty'))}
async function openEmail(id){selected=id;render();const ticket=++request;reader.replaceChildren(el('div','Loading message…','empty'));try{const res=await fetch(`/emails/${id}/preview`);if(!res.ok)throw Error('Could not load this email.');const e=await res.json();if(ticket!==request)return;const card=el('section',undefined,'card');card.append(el('h2',e.subject));for(const [label,value] of [['From',e.from],['To',e.to],['Date',e.date]])card.append(el('div',`${label}: ${value}`,'meta'));card.append(el('pre',e.body));const attach=el('section',undefined,'card'),bar=el('div',undefined,'toolbar');bar.append(el('span','Invoice attachment'));for(const [title,url,cls] of [['Open PDF',`/emails/${id}/attachment`,'primary'],['Download email',`/emails/${id}/raw`,'']]){const a=el('a',title,cls);a.href=url;if(title==='Open PDF'){a.target='_blank';a.rel='noopener'}bar.append(a)}const frame=el('iframe');frame.title='Invoice PDF preview';frame.src=`/emails/${id}/attachment#toolbar=1`;attach.append(bar,frame);reader.replaceChildren(card,attach)}catch(err){if(ticket===request)reader.replaceChildren(el('div',err.message,'empty'))}}
search.oninput=render;fetch('/emails').then(r=>{if(!r.ok)throw Error('Could not load inbox.');return r.json()}).then(data=>{emails=data;render();if(emails.length)openEmail(emails[0].id)}).catch(e=>{document.querySelector('#count').textContent=e.message});
</script></body></html>
